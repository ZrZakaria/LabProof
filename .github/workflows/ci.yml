name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run pytest with coverage
        working-directory: backend
        env:
          LABPROOF_DATABASE_URL: postgresql://labproof_test:labproof_test@localhost:5432/labproof_test
          LABPROOF_OLLAMA_URL: http://localhost:11434
          LABPROOF_LLM_MODEL: fake
          LABPROOF_EMBED_MODEL: fake
          LABPROOF_EMBED_DIM: 1024
          LABPROOF_RERANKER_MODEL: ""
          LABPROOF_NLI_MODEL: ""
          LABPROOF_MIN_RERANK_SCORE: 0.0
        run: PYTHONPATH=. pytest --ignore=tests/test_integration.py --cov=app --cov=eval --cov-report=term-missing --cov-fail-under=69

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npx ng build