name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: labproof_test
          POSTGRES_PASSWORD: labproof_test
          POSTGRES_DB: labproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labproof_test -d labproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install backend deps
        working-directory: backend
        run: |
          # Try uv first, fall back to pip
          if uv pip install -e ".[dev]"; then
            echo "uv install succeeded"
          else
            echo "uv failed, falling back to pip"
            pip install -e ".[dev]"
          fi

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run pytest with coverage
        working-directory: backend
        env:
          LABPROOF_DATABASE_URL: postgresql://labproof_test:labproof_test@localhost:5432/labproof_test
          LABPROOF_OLLAMA_URL: http://localhost:11434
          LABPROOF_LLM_MODEL: fake
          LABPROOF_EMBED_MODEL: fake
          LABPROOF_EMBED_DIM: 1024
          LABPROOF_RERANKER_MODEL: ""
          LABPROOF_NLI_MODEL: ""
          LABPROOF_MIN_RERANK_SCORE: 0.0
        run: uv run pytest --cov=app --cov=eval --cov-report=term-missing --cov-fail-under=75

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npx ng build