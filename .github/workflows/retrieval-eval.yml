name: Retrieval Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # weekly on Monday 03:00 UTC

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      db:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: labproof
          POSTGRES_PASSWORD: labproof
          POSTGRES_DB: labproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labproof -d labproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install backend deps
        working-directory: backend
        run: uv pip install -e ".[dev]"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull bge-m3

      - name: Download corpus
        working-directory: backend
        run: python -m scripts.download_corpus

      - name: Ingest corpus
        working-directory: backend
        env:
          LABPROOF_DATABASE_URL: postgresql://labproof:labproof@localhost:5432/labproof
          LABPROOF_OLLAMA_URL: http://localhost:11434
          LABPROOF_EMBED_MODEL: bge-m3
          LABPROOF_EMBED_DIM: 1024
        run: python -m scripts.ingest_corpus

      - name: Run retrieval evaluation (hybrid + reranker)
        working-directory: backend
        env:
          LABPROOF_DATABASE_URL: postgresql://labproof:labproof@localhost:5432/labproof
          LABPROOF_OLLAMA_URL: http://localhost:11434
          LABPROOF_EMBED_MODEL: bge-m3
          LABPROOF_EMBED_DIM: 1024
          LABPROOF_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
          LABPROOF_CANDIDATES_PER_RETRIEVER: 30
          LABPROOF_TOP_K: 5
          LABPROOF_RRF_K: 60
        run: python -m eval.run_eval --retrieval-only --mode hybrid --tag ci-weekly

      - name: Check hit@5 baseline
        working-directory: backend
        run: |
          # Adjust this threshold to your measured baseline
          BASELINE_HIT_AT_5=0.85
          LATEST=$(ls -t eval/results/*.json | head -1)
          HIT=$(python -c "import json; d=json.load(open('$LATEST')); print(d['summary']['hit@k'])")
          echo "Measured hit@5: $HIT"
          python -c "import sys; hit=float('$HIT'); base=float('$BASELINE_HIT_AT_5'); sys.exit(0 if hit >= base else 1)"